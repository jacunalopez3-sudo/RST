<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reporte de ST BHS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--card:#121a34;--muted:#8aa0c6;--text:#ebf0ff;--border:#253055;--ok:#18a877;--danger:#e74a3b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:linear-gradient(180deg,#0a0f1e,#0b1228 40%,#09102a);color:var(--text)}header{position:sticky;top:0;z-index:4;background:#09102ae8;border-bottom:1px solid var(--border)}.wrap{max-width:1450px;margin:auto;padding:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.grid2,.grid3,.grid4{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:820px){.grid2{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}}label{display:block;margin:12px 0 7px;color:var(--muted);font-weight:600}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:#0f1732;color:var(--text);font-size:1rem}textarea{min-height:135px}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{padding:11px 15px;border-radius:12px;border:1px solid var(--border);background:#101a35;color:var(--text);font-weight:700}button.ok{background:var(--ok)}button.danger{background:var(--danger)}button:disabled{opacity:.55}.hidden{display:none!important}.muted{color:var(--muted)}#sigPad{width:100%;height:220px;background:#0f1732;border:1px dashed var(--border);border-radius:12px}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:10px}.thumbs img{width:100%;height:90px;object-fit:cover;border-radius:10px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(440px,100%)}.report{background:#0f1732;border:1px solid var(--border);border-radius:12px;padding:12px;margin:9px 0}.small{font-size:.9rem}
</style>
</head>
<body>
<section id="loginView" class="login"><div class="card"><h1>Reportes BHS</h1><p class="muted">Ingrese con su usuario autorizado.</p><form id="loginForm"><label>Correo</label><input id="loginEmail" type="email" required><label>Contraseña</label><input id="loginPassword" type="password" required><div class="btns"><button class="ok" type="submit">Ingresar</button></div><p id="loginMsg" class="muted"></p></form></div></section>
<div id="appView" class="hidden"><header><div class="wrap top"><h1>Reporte de Servicio Técnico – BHS</h1><div><span id="userEmail" class="small"></span> <button id="logoutBtn">Cerrar sesión</button></div></div></header><main class="wrap">
<section class="card"><h2>Nuevo reporte</h2><form id="reporteForm">
<div class="grid3"><div><label>Ingeniería</label><select id="tecnicoBHS" required><option>Ing. Juan Carlos A</option><option>Ing. Leonardo Chacón C</option></select></div><div><label>Teléfono BHS</label><input id="phoneBHS" value="6037-4749"></div><div><label>Email BHS</label><input id="emailBHS" type="email" value="serviciotecncio@bennucr.com"></div></div>
<div class="grid4"><div><label>N° de reporte</label><input id="numReporte" readonly><p class="muted small">Número estimado; el definitivo se reserva al generar.</p></div><div><label>Fecha</label><input id="fecha" type="date" required></div><div><label>Hora inicio</label><input id="horaIni" type="time" required></div><div><label>Hora fin</label><input id="horaFin" type="time" required></div></div>
<div class="grid3"><div><label>Cliente / Clínica / Hospital</label><input id="cliente" required></div><div><label>Responsable en sitio</label><input id="responsable" required></div><div><label>Correo cliente</label><input id="correo" type="email"></div></div>
<div class="grid4"><div><label>Equipo</label><input id="equipo" required></div><div><label>Marca</label><input id="marca" required></div><div><label>Modelo</label><input id="modelo" required></div><div><label>N° de serie</label><input id="serie" required></div></div>
<div class="grid2"><div><label>Activo</label><input id="activo"></div><div><label>Actuación</label><select id="actuacion"><option>Mtto Preventivo</option><option>Mtto Correctivo</option><option>Instalación de Repuesto</option><option>Otro</option></select></div></div>
<div class="grid2"><div><label>Cantidad</label><input id="cantidad" type="number" step="0.1" value="1"></div><div><label>Estado final</label><select id="estado"><option>Operativo</option><option>Operativo con observaciones</option><option>En espera de repuesto</option><option>No operativo</option></select></div></div>
<div class="grid2"><div><label>Repuestos utilizados</label><input id="repuestos"></div><div><label>Horas trabajadas</label><input id="horas" type="number" step="0.1" value="1"></div></div>
<label>Observaciones / diagnóstico</label><textarea id="acciones" required></textarea>
<label>Fotografías</label><div class="btns"><button type="button" id="btnGaleria">Seleccionar fotos</button><button type="button" id="btnCamara">Tomar foto</button><button type="button" class="danger" id="btnLimpiarFotos">Limpiar fotos</button></div><input id="fotosGaleria" class="hidden" type="file" accept="image/*" multiple><input id="fotosCamara" class="hidden" type="file" accept="image/*" capture="environment" multiple><div id="thumbs" class="thumbs"></div>
<div class="grid2"><div><label>Logo</label><input id="logoInput" type="file" accept="image/*"><div class="btns"><button type="button" id="guardarLogo">Fijar logo</button><button type="button" id="restaurarLogo">Restaurar logo</button></div></div><div><label>Firma del cliente</label><canvas id="sigPad"></canvas><div class="btns"><button type="button" id="limpiarFirma">Limpiar firma</button></div></div></div>
<div class="btns"><button id="pdf" class="ok" type="button">Guardar y generar PDF</button><button id="limpiarForm" class="danger" type="reset">Limpiar formulario</button></div><p id="saveStatus" class="muted">El PDF se guardará automáticamente en Supabase.</p>
</form></section>
<section class="card"><div class="top"><h2>Reportes recientes</h2><button id="refreshHistory">Actualizar</button></div><div id="history"></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@5.0.10/dist/signature_pad.umd.min.js"></script>
<script>
const URL_SB='https://vzdgulthgpkkcosofrlu.supabase.co',KEY_SB='sb_publishable_MB0N-NzDwzrLrKOr5iUI5A_xnWDPfr9',db=window.supabase.createClient(URL_SB,KEY_SB),$=id=>document.getElementById(id),get=id=>$(id).value.trim();let fotos=[],logo=null,busy=false,channel=null;const pad=n=>String(n).padStart(2,'0'),safe=s=>String(s||'').replace(/[^a-z0-9_-]+/gi,'_');
function dataURL(f){return new Promise((r,j)=>{const x=new FileReader;x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}function initTime(){const d=new Date,t=pad(d.getHours())+':'+pad(d.getMinutes());$('fecha').value=d.toISOString().slice(0,10);$('horaIni').value=t;$('horaFin').value=t}function duration(a,b){const x=a.split(':').map(Number),y=b.split(':').map(Number);let m=x[0]*60+x[1],n=y[0]*60+y[1];if(n<m)n+=1440;return Math.floor((n-m)/60)+':'+pad((n-m)%60)}
const canvas=$('sigPad'),sig=new SignaturePad(canvas,{backgroundColor:'rgba(0,0,0,0)'});function resize(){const r=Math.max(devicePixelRatio||1,1);canvas.width=canvas.offsetWidth*r;canvas.height=canvas.offsetHeight*r;canvas.getContext('2d').setTransform(r,0,0,r,0,0);sig.clear()}addEventListener('resize',resize);$('limpiarFirma').onclick=()=>sig.clear();
$('btnGaleria').onclick=()=>$('fotosGaleria').click();$('btnCamara').onclick=()=>$('fotosCamara').click();async function addFotos(fs){for(const f of fs)fotos.push(await dataURL(f));$('thumbs').innerHTML=fotos.map(x=>'<img src="'+x+'">').join('')}$('fotosGaleria').onchange=e=>addFotos(e.target.files);$('fotosCamara').onchange=e=>addFotos(e.target.files);$('btnLimpiarFotos').onclick=()=>{fotos=[];$('thumbs').innerHTML=''};
$('logoInput').onchange=async e=>logo=e.target.files[0]?await dataURL(e.target.files[0]):null;$('guardarLogo').onclick=()=>{if(!logo)return alert('Seleccione un logo');localStorage.setItem('bhs_ot_logo_fijo',logo)};$('restaurarLogo').onclick=()=>localStorage.removeItem('bhs_ot_logo_fijo');
async function next(){const{data,error}=await db.from('service_reports').select('report_number').order('report_number',{ascending:false}).limit(1);$('numReporte').value=error?'Sin conexión':String((data?.[0]?.report_number||94)+1).padStart(5,'0')}
async function reserve(){const p={report_date:get('fecha'),start_time:get('horaIni'),end_time:get('horaFin'),engineer:get('tecnicoBHS'),company_phone:get('phoneBHS'),company_email:get('emailBHS'),client_name:get('cliente'),client_contact:get('responsable'),client_email:get('correo')||null,equipment:get('equipo'),brand:get('marca'),model:get('modelo'),serial_number:get('serie'),asset_number:get('activo')||null,service_type:get('actuacion'),quantity:Number(get('cantidad')||0),final_status:get('estado'),spare_parts:get('repuestos')||null,worked_hours:Number(get('horas')||0),observations:get('acciones'),status:'reserved'};const{data,error}=await db.from('service_reports').insert(p).select('id,report_number').single();if(error)throw error;return data}

async function save(){if(busy)return;if(!$('reporteForm').reportValidity())return;busy=true;$('pdf').disabled=true;let r;try{$('saveStatus').textContent='Reservando consecutivo...';r=await reserve();const o={n:r.report_number,date:get('fecha'),start:get('horaIni'),end:get('horaFin'),time:duration(get('horaIni'),get('horaFin')),engineer:get('tecnicoBHS'),client:get('cliente'),contact:get('responsable'),mail:get('correo'),equipment:get('equipo'),brand:get('marca'),model:get('modelo'),serial:get('serie'),asset:get('activo'),type:get('actuacion'),state:get('estado'),hours:get('horas'),notes:get('acciones')},doc=pdfDoc(o),blob=doc.output('blob'),name='OT_'+String(o.n).padStart(5,'0')+'_'+safe(o.equipment)+'_'+safe(o.serial)+'.pdf',path=o.date.slice(0,4)+'/'+name;$('saveStatus').textContent='Subiendo PDF...';const up=await db.storage.from('service-reports').upload(path,blob,{contentType:'application/pdf'});if(up.error)throw up.error;const u=await db.from('service_reports').update({pdf_path:path,status:'completed'}).eq('id',r.id);if(u.error)throw u.error;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();$('saveStatus').textContent='Reporte R#'+String(o.n).padStart(5,'0')+' guardado.';await Promise.all([next(),history()])}catch(e){if(r)await db.from('service_reports').update({status:'failed'}).eq('id',r.id);$('saveStatus').textContent='Error: '+e.message;alert('No se pudo guardar el reporte.\n'+e.message)}finally{busy=false;$('pdf').disabled=false}}$('pdf').onclick=save;
async function history(){const{data,error}=await db.from('service_reports').select('report_number,report_date,engineer,client_name,equipment,serial_number,final_status,pdf_path').order('report_number',{ascending:false}).limit(20);if(error){$('history').innerHTML='<p class="muted">No se pudo cargar.</p>';return}$('history').innerHTML=data.map(r=>'<div class="report"><b>R#'+String(r.report_number).padStart(5,'0')+' · '+r.client_name+'</b><div class="small">'+r.report_date+' · '+r.engineer+'</div><div class="small">'+r.equipment+' · '+(r.serial_number||'-')+'</div>'+(r.pdf_path?'<button data-path="'+r.pdf_path+'">Abrir PDF</button>':'')+'</div>').join('')||'<p class="muted">Sin reportes.</p>';$('history').querySelectorAll('[data-path]').forEach(b=>b.onclick=async()=>{const{x,error}=await signed(b.dataset.path);if(!error)open(x,'_blank')})}async function signed(path){const{data,error}=await db.storage.from('service-reports').createSignedUrl(path,300);return{x:data?.signedUrl,error}}$('refreshHistory').onclick=history;

</script></body></html>
