<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reporte de ST BHS</title>
  <meta name="description" content="Reporte técnico BHS con consecutivo centralizado, PDF y respaldo en Supabase." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--card:#121a34;--muted:#8aa0c6;--text:#ebf0ff;--border:#253055;--shadow:0 10px 30px rgba(0,0,0,.35);--radius:18px;--success:#18a877;--danger:#e74a3b}
    *{box-sizing:border-box}html,body{min-height:100%}
    body{margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0a0f1e,#0b1228 40%,#09102a);color:var(--text);font-size:16px}
    header{position:sticky;top:0;z-index:5;background:rgba(9,16,42,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
    .wrap{max-width:1500px;margin:0 auto;padding:18px}.header-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1{margin:0;font-size:1.45rem;font-weight:800}h2{margin:0 0 12px;font-size:1.2rem}.row{display:grid;grid-template-columns:1fr;gap:18px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
    label{display:block;margin:12px 0 8px;color:var(--muted);font-size:1rem;font-weight:600}
    input,textarea,select{width:100%;padding:14px;border-radius:14px;border:1px solid var(--border);background:#0f1732;color:var(--text);outline:none;font-size:1.02rem}
    textarea{min-height:140px;resize:vertical}.grid-2,.grid-3,.grid-4{display:grid;grid-template-columns:1fr;gap:14px}
    @media(min-width:820px){.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr 1fr}.grid-4{grid-template-columns:1fr 1fr 1fr 1fr}}

    .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}button,.btn{appearance:none;border:1px solid var(--border);background:#101a35;color:var(--text);border-radius:16px;padding:12px 16px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);font-size:1rem}

</head>
<body>
<header><div class="wrap header-row"><h1>Reporte de Servicio Técnico – BHS</h1><div id="sessionBar" class="hidden"><span id="sessionEmail" class="muted"></span> <button type="button" id="logoutBtn">Cerrar sesión</button></div></div></header>
<main class="wrap">
  <section id="loginCard" class="card login"><h2>Ingreso de ingeniería</h2><p class="muted">Use el correo y contraseña asignados en Supabase.</p><form id="loginForm"><label>Correo</label><input id="loginEmail" type="email" autocomplete="username" required><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" required><div class="btns"><button class="success" type="submit" id="loginBtn">Ingresar</button></div><div id="loginStatus" class="footer"></div></form></section>
  <div id="app" class="hidden row">
    <section class="card">
      <div class="header-row"><div><h2>Nuevo reporte</h2><div id="cloudStatus" class="footer">Conectando con Supabase…</div></div><button type="button" id="refreshBtn">Actualizar consecutivo</button></div>
      <form id="reporteForm">
        <div class="subhead">Datos empresa (BHS)</div>
        <div class="grid-3"><div><label>Ingeniería</label><select id="tecnicoBHS" required><option value="" disabled>Seleccionar…</option><option>Ing. Juan Carlos A</option><option>Ing. Leonardo Chacón C</option></select></div><div><label>Teléfono (BHS)</label><input type="text" id="phoneBHS" value="6037-4749"></div><div><label>Email (BHS)</label><input type="email" id="emailBHS" value="serviciotecncio@bennucr.com"></div></div>
        <div class="grid-4"><div><label>Próximo número estimado</label><input type="text" id="numReporte" readonly value="Consultando…"><div class="footer">El número definitivo se reserva al generar el PDF.</div></div><div><label>Fecha</label><input type="date" id="fecha" required></div><div><label>Hora inicio</label><input type="time" id="horaIni" required></div><div><label>Hora fin</label><input type="time" id="horaFin" required></div></div>
        <div class="grid-3"><div><label>Cliente / Clínica / Hospital</label><input type="text" id="cliente" required></div><div><label>Responsable en sitio</label><input type="text" id="responsable" required></div><div><label>Correo del cliente</label><input type="email" id="correo"></div></div>
        <div class="subhead">Equipo atendido</div><div class="grid-4"><div><label>Equipo</label><input type="text" id="equipo" required></div><div><label>Marca</label><input type="text" id="marca" required></div><div><label>Modelo</label><input type="text" id="modelo" required></div><div><label>N° de serie</label><input type="text" id="serie" required></div></div>
        <div class="grid-2"><div><label>Activo</label><input type="text" id="activo"></div><div><label>Actuación</label><select id="actuacion"><option>Mtto Preventivo</option><option>Mtto Correctivo</option><option>Instalación de Repuesto</option><option>Otro</option></select></div></div>
        <div class="grid-2"><div><label>Cantidad</label><input type="number" id="cantidad" step="0.1" min="0" value="1"></div><div><label>Estado final</label><select id="estado"><option>Operativo</option><option>Operativo con observaciones</option><option>En espera de repuesto</option><option>No operativo</option></select></div></div>
        <div class="grid-2"><div><label>Repuestos utilizados</label><input type="text" id="repuestos"></div><div><label>Horas trabajadas</label><input type="number" id="horas" step="0.1" min="0" value="1"></div></div>
        <label>Observaciones / diagnóstico</label><textarea id="acciones" required></textarea>
        <label>Fotografías (evidencia)</label><div class="btns"><button type="button" id="btnFotosGaleria">Seleccionar de Fototeca / Archivos</button><button type="button" id="btnFotosCamara">Tomar foto</button><button type="button" class="danger" id="btnLimpiarFotos">Limpiar fotos</button></div><input type="file" id="fotosGaleria" accept="image/*" multiple class="hidden"><input type="file" id="fotosCamara" accept="image/*" capture="environment" multiple class="hidden"><div id="thumbs" class="thumbs"></div>
        <div class="grid-2"><div><label>Logo de empresa</label><input type="file" id="logoInput" accept="image/*"><div class="btns"><button type="button" id="btnFijarLogo">Fijar logo</button><button type="button" class="danger" id="btnRestaurarLogo">Restaurar logo</button></div></div><div><label>Firma del cliente</label><canvas id="sigPad"></canvas><div class="btns"><button type="button" id="limpiarFirma">Limpiar firma</button></div></div></div>
        <div class="btns"><button type="button" class="success" id="pdf">Guardar y generar PDF</button><button type="reset" class="danger" id="limpiarForm">Limpiar formulario</button></div>
      </form>
    </section>
    <section class="card"><div class="header-row"><h2>Últimos reportes guardados</h2><button type="button" id="reloadReportsBtn">Actualizar lista</button></div><div id="reportsList" class="reports"><div class="muted">Cargando…</div></div></section>
  </div>
</main>

function createPDF(obj){const{jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'a4'}),pageW=doc.internal.pageSize.getWidth(),pageH=doc.internal.pageSize.getHeight(),M=36,right=pageW-M,maxW=pageW-2*M;let y=M;const rect=(x,y0,w,h,soft=false)=>{doc.setDrawColor(...(soft?[151,166,191]:[43,52,69]));doc.setLineWidth(soft?.7:1);doc.rect(x,y0,w,h)},bold=(t,x,y0,s=10)=>{doc.setFont('helvetica','bold');doc.setFontSize(s);doc.text(String(t||''),x,y0)},norm=(t,x,y0,s=10)=>{doc.setFont('helvetica','normal');doc.setFontSize(s);doc.text(String(t||''),x,y0)},newPage=()=>{doc.addPage();y=M;rect(M-6,M-6,pageW-2*(M-6),pageH-2*(M-6))},ensure=n=>{if(y+n>pageH-M)newPage()};rect(M-6,M-6,pageW-2*(M-6),pageH-2*(M-6));rect(M,y,maxW,110);if(obj.logo){try{doc.addImage(obj.logo,detectFormat(obj.logo),M+12,y+12,150,75)}catch(_){}}bold(HEADER.company,M+175,y+22,12);norm('Cédula Jurídica: '+HEADER.legalId,M+175,y+38,9);norm(HEADER.address,M+175,y+52,9);norm('Ingeniería: '+obj.tecnicoBHS,M+175,y+68,9);norm('Email: '+obj.emailBHS+' | Tel: '+obj.phoneBHS,M+175,y+84,9);y+=124;rect(M,y,maxW,52);bold('REPORTE DE SERVICIO',M+12,y+20,12);bold('R#'+padReport(obj.consecutivo),right-110,y+20,12);norm(`Fecha: ${obj.fecha} Hora: ${obj.horaIni}-${obj.horaFin} Tiempo: ${obj.duracion}`,M+12,y+40,9);y+=66;ensure(130);rect(M,y,maxW,115);const mid=M+maxW/2;doc.line(mid,y,mid,y+115);bold('DATOS DEL CLIENTE',M+12,y+18);bold('DATOS DEL EQUIPO',mid+12,y+18);norm('Cliente: '+(obj.cliente||'-'),M+12,y+40);norm('Responsable: '+(obj.responsable||'-'),M+12,y+58);norm('Correo: '+(obj.correo||'-'),M+12,y+76);norm('Equipo: '+(obj.equipo||'-'),mid+12,y+40);norm(`Marca/Modelo: ${obj.marca||'-'} / ${obj.modelo||'-'}`,mid+12,y+58);norm(`Serie/Activo: ${obj.serie||'-'} / ${obj.activo||'-'}`,mid+12,y+76);y+=129;ensure(80);rect(M,y,maxW,62);bold('SERVICIO',M+12,y+18);norm('Actuación: '+obj.actuacion,M+12,y+38);norm('Cantidad: '+obj.cantidad,M+230,y+38);norm('Estado final: '+obj.estado,M+360,y+38);y+=76;ensure(72);rect(M,y,maxW,54); async function generarYGuardar(){if(generating)return;const form=el('reporteForm');if(!form.reportValidity())return;generating=true;el('pdf').disabled=true;el('pdf').textContent='Guardando…';let reportId=null;try{const provisional=formObject(null),{data:inserted,error:insertError}=await db.from('service_reports').insert(reportRow(provisional)).select('id,report_number').single();if(insertError)throw insertError;reportId=inserted.id;const obj=formObject(Number(inserted.report_number));el('numReporte').value='R#'+padReport(obj.consecutivo);const{blob,filename}=createPDF(obj),year=(obj.fecha||new Date().getFullYear().toString()).slice(0,4),path=`${year}/${padReport(obj.consecutivo)}_${crypto.randomUUID()}_${filename}`,{error:uploadError}=await db.storage.from('service-reports').upload(path,blob,{contentType:'application/pdf',upsert:false});if(uploadError)throw uploadError;const{error:updateError}=await db.from('service_reports').update({pdf_path:path,status:'completed'}).eq('id',reportId);if(updateError)throw updateError;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast(`Reporte R#${padReport(obj.consecutivo)} guardado en Supabase y descargado.`);await refreshNextNumber();await loadReports()}catch(error){console.error(error);if(reportId)await db.from('service_reports').update({status:'failed'}).eq('id',reportId);alert('No se pudo guardar el reporte: '+(error.message||error))}finally{generating=false;el('pdf').disabled=false;el('pdf').textContent='Guardar y generar PDF'}}

el('loginForm').addEventListener('submit',async e=>{e.preventDefault();el('loginBtn').disabled=true;el('loginStatus').textContent='Ingresando…';const{error}=await db.auth.signInWithPassword({email:value('loginEmail'),password:value('loginPassword')});el('loginBtn').disabled=false;el('loginStatus').textContent=error?error.message:''});el('logoutBtn').addEventListener('click',()=>db.auth.signOut());el('refreshBtn').addEventListener('click',refreshNextNumber);el('reloadReportsBtn').addEventListener('click',loadReports);el('pdf').addEventListener('click',generarYGuardar);el('limpiarFirma').addEventListener('click',()=>signaturePad.clear());el('btnFotosGaleria').addEventListener('click',()=>el('fotosGaleria').click());el('btnFotosCamara').addEventListener('click',()=>el('fotosCamara').click());el('btnLimpiarFotos').addEventListener('click',()=>{fotosDataURLs=[];renderThumbs()});async function handleFotos(files){for(const f of Array.from(files||[]))fotosDataURLs.push(await fileToDataURL(f));renderThumbs()}el('fotosGaleria').addEventListener('change',async e=>{await handleFotos(e.target.files);e.target.value=''});el('fotosCamara').addEventListener('change',async e=>{await handleFotos(e.target.files);e.target.value=''});function renderThumbs(){el('thumbs').innerHTML='';for(const url of fotosDataURLs){const img=document.createElement('img');img.src=url;el('thumbs').appendChild(img)}}el('logoInput').addEventListener('change',async e=>{logoSeleccionado=e.target.files?.[0]?await fileToDataURL(e.target.files[0]):null});el('btnFijarLogo').addEventListener('click',()=>{if(!logoSeleccionado)return alert('Seleccione primero un logo.');setLogoFijo(logoSeleccionado);toast('Logo fijado en este dispositivo.')});el('btnRestaurarLogo').addEventListener('click',async()=>{localStorage.removeItem(LS_KEY_LOGO);await ensureDefaultLogo();toast('Logo restaurado.')});el('limpiarForm').addEventListener('click',()=>setTimeout(()=>{signaturePad.clear();fotosDataURLs=[];renderThumbs();initFechaHora();refreshNextNumber()},0));
(async function init(){initFechaHora();await ensureDefaultLogo();const{data:{session}}=await db.auth.getSession();showSession(session);db.auth.onAuthStateChange((_event,newSession)=>showSession(newSession))})();
</script>
